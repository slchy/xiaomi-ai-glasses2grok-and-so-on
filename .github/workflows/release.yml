name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        working-directory: sdk
        # tag 去掉前缀的 v 当版本号：v0.1.0 → 0.1.0，产物不会带 -SNAPSHOT
        run: ./gradlew test -PmiaiglassesVersion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Assemble
        working-directory: sdk
        run: ./gradlew assemble :sample:assembleDebug -PmiaiglassesVersion="${GITHUB_REF_NAME#v}" --console=plain

      # 产物：sample 是可直接安装的演示 App（debug 签名）；core-proto / core-api / core
      # 是 jar；facade / ktx / transport 是 release AAR。debug AAR 不对外发。
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp sdk/sample/build/outputs/apk/debug/sample-debug.apk \
             "dist/xiaomi-ai-glasses-sample-${VERSION}-debug.apk"
          cp sdk/*/build/libs/*.jar dist/ 2>/dev/null || true
          # AAR 的默认文件名是 <module>-release.aar，不带版本 —— 重命名后再挂出去
          for aar in sdk/*/build/outputs/aar/*-release.aar; do
            [ -e "$aar" ] || continue
            base="$(basename "$aar")"
            module="${base%-release.aar}"
            cp "$aar" "dist/${module}-${VERSION}.aar"
          done
          ls -lh dist
          test -n "$(ls -A dist)"

      - name: Create GitHub release
        # 手动 dispatch 只做「能不能构建」的冒烟验证，不产生 release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
