name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME / ANDROID_SDK_ROOT 已设置），
      # AGP 8.5 + compileSdk 34 可直接用，不需要 local.properties。
      - name: Unit tests
        working-directory: sdk
        run: ./gradlew test --console=plain

      - name: Assemble jars & AARs
        working-directory: sdk
        run: ./gradlew assemble --console=plain

      - name: Python frame tests
        run: python3 tests/test_frame.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-artifacts
          path: |
            sdk/*/build/libs/*.jar
            sdk/*/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14
