# dsh profile patch：把眼镜相机与会话控制挂成 MCP 工具
#
# 用法：dsh --profile sdk --patch <deploy-dir>/mcp/camera.yml
# 工具名对模型是 mcp__camera__take_photo 与 mcp__session__end_session。
#
# 注意 patch 的格式（见 dsh-app-boot 的 applyEntryPatches）：
#   - 裸条目 = 按 id 覆盖已有节点，找不到就报 "entry not found"
#   - 要**新增**节点必须用 `insert:`，不带顶层 id 时追加到最外层
#
# 两个工具都只 POST 本机控制口（8767），真正的硬件/连接动作在 harness 里：
#   take_photo  → harness 经常驻 TCP 让手机复用 WakeUpEvent 的
#                 transactionId/requestId 发 multiModel，再把 JPEG 回给它
#   end_session → harness 挂「本轮说完就结束」的旗子，播完断开连接
- insert:
    - id: mcp-camera
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: camera
        transport: stdio
        command: node
        args:
          - <deploy-dir>/mcp/mcp-camera.mjs
        toolCallTimeoutMs: 30000
        failOnStartupError: false
    - id: mcp-session
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: session
        transport: stdio
        command: node
        args:
          - <deploy-dir>/mcp/mcp-session.mjs
        toolCallTimeoutMs: 10000
        failOnStartupError: false
